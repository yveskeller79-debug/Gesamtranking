<!DOCTYPE html>
<!-- v2.2 -- Moderne Datei-Anbindung -->
<html lang="de">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jassstatistik Wädi 2026/2027</title>
  <style>
    :root {
      --green-dark: #000000;
      --green-mid: #2d6147;
      --green-felt: #3a7d5a;
      --gold: #c9a84c;
      --cream: #f7f2e8;
      --text: #1a1a1a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Mono', monospace; background: var(--green-dark); color: var(--cream); min-height: 100vh; }

    header {
      background: linear-gradient(160deg, var(--green-mid) 0%, var(--green-dark) 100%);
      border-bottom: 3px solid var(--gold);
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      position: relative;
    }
    header h1 { font-family: 'Fraunces', serif; font-weight: 700; font-size: clamp(2rem, 5vw, 3.5rem); color: var(--gold); }
    header p { margin-top: 0.5rem; font-size: 0.8rem; color: rgba(247,242,232,0.5); letter-spacing: 0.15em; text-transform: uppercase; }

    .podium-section { max-width: 700px; margin: 3rem auto 0; padding: 0 1.5rem; text-align: center; }
    .section-label { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.5rem; }
    .podium { display: flex; align-items: flex-end; justify-content: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .podium-place { display: flex; flex-direction: column; align-items: center; }
    .podium-name { font-family: 'Fraunces', serif; font-weight: 700; margin-bottom: 0.4rem; }
    .podium-bar { width: 90px; border-radius: 4px 4px 0 0; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-style: italic; font-size: 1.5rem; }
    
    .place-1 .podium-bar { height: 120px; background: var(--gold); color: var(--green-dark); }
    .place-2 .podium-bar { height: 85px; background: #a0a0a0; color: var(--green-dark); }
    .place-3 .podium-bar { height: 60px; background: #8b6341; color: var(--cream); }
    .podium-base { height: 4px; background: var(--gold); opacity: 0.3; width: 100%; }

    main { max-width: 1000px; margin: 3rem auto; padding: 0 1.5rem 4rem; }
    .chart-section { margin-bottom: 3rem; }
    .chart-wrap { background: rgba(255,255,255,0.04); border: 1px solid rgba(201,168,76,0.2); border-radius: 6px; padding: 1.5rem; }
    .chart-canvas-wrap { position: relative; height: 220px; }

    /* Tabellen */
    .table-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .stat-card { background: rgba(255,255,255,0.04); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
    .stat-card-title { font-size: 0.85rem; padding: 0.6rem 0.9rem; background: rgba(0,0,0,0.15); color: var(--gold); }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 0.5rem 0.9rem; text-align: left; }
    th { color: rgba(247,242,232,0.35); font-size: 0.65rem; text-transform: uppercase; border-bottom: 1px solid rgba(201,168,76,0.1); }
    td { border-bottom: 1px solid rgba(255,255,255,0.04); }
    .val-cell { text-align: right; }

    /* Navigation */
    .tab-nav { display: flex; justify-content: center; gap: 0.75rem; padding: 1.5rem 1rem 0; }
    .tab-btn { font-family: 'DM Mono', monospace; font-size: 0.8rem; padding: 0.6rem 1.5rem; border-radius: 4px; border: 1px solid rgba(201,168,76,0.3); background: transparent; color: rgba(247,242,232,0.5); cursor: pointer; }
    .tab-btn.active { background: var(--gold); color: var(--green-dark); font-weight: bold; }
    .sub-nav { display: none; justify-content: center; gap: 0.4rem; padding: 0.75rem 1rem 0; border-top: 1px solid rgba(201,168,76,0.1); margin-top: 0.75rem; }
    .sub-nav.open { display: flex; }
    .sub-btn { font-family: 'DM Mono', monospace; font-size: 0.7rem; padding: 0.35rem 0.9rem; border-radius: 4px; border: 1px solid rgba(201,168,76,0.2); background: transparent; color: rgba(247,242,232,0.4); cursor: pointer; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    
    footer { text-align: center; padding: 1.5rem; font-size: 0.65rem; color: rgba(247,242,232,0.2); border-top: 1px solid rgba(201,168,76,0.1); }
  </style>
</head>
<body>

<header>
  <h1>Jassstatistik Wädi</h1>
  <p>Saison 2026 / 2027</p>
  <div id="header-meta" style="margin-top:0.75rem; display:flex; justify-content:center; gap:1.5rem;">
    <span style="font-size:0.7rem; color:rgba(247,242,232,0.4);">Stand: <span id="meta-datum">Lade...</span></span>
    <span style="font-size:0.7rem; color:rgba(247,242,232,0.4);">Abende: <span id="meta-abende">Lade...</span></span>
  </div>
</header>

<div class="tab-nav">
  <button class="tab-btn active" id="main-btn-2627" onclick="switchMain('2627')">Aktuelle Saison</button>
  <button class="tab-btn" id="main-btn-einzelabend" onclick="switchMain('einzelabend')">Einzelabende</button>
  <button class="tab-btn" id="main-btn-historie" onclick="switchMain('historie')">Historie</button>
</div>

<!-- Dynamische Knöpfe für die Einzelabende aus der JSON -->
<div class="sub-nav" id="sub-einzelabend">
  <div id="einzelabend-buttons"></div>
</div>

<div class="sub-nav" id="sub-historie">
  <button class="sub-btn" onclick="alert('Lade 25/26 aus Excel...')">2025 / 26</button>
  <button class="sub-btn" onclick="alert('Lade 24/25 aus Excel...')">2024 / 25</button>
</div>

<!-- HAUPTPANEL -->
<div class="tab-panel active" id="tab-2627">
  <div id="loading" style="text-align:center; padding:4rem; color:rgba(247,242,232,0.4);">Daten werden aus Dateien geladen…</div>
  
  <div id="app" style="display:none;">
    <div class="podium-section">
      <p class="section-label">Gesamtwertung</p>
      <div class="podium" id="podium-container"></div>
      <div class="podium-base"></div>
    </div>

    <main>
      <div class="chart-section">
        <div class="chart-wrap">
          <div class="chart-canvas-wrap"><canvas id="pokalChart"></canvas></div>
        </div>
      </div>
      
      <div class="table-grid" id="daten-tabellen">
        <!-- Hier landen die Daten-Karten aus der Excel -->
      </div>
    </main>
  </div>
</div>

<div class="tab-panel" id="tab-einzelabend">
  <div id="einzelabend-content" style="max-width:1000px; margin:3rem auto; padding:0 1.5rem 4rem; text-align:center;">
    <div style="color:rgba(247,242,232,0.4);">Wähle oben einen spezifischen Jassabend aus.</div>
  </div>
</div>

<footer>
  Statistik-App &copy; 2026 | Datenquellen: Statistik_Jassen.xlsx & abende.json
</footer>

<!-- Externe Bibliotheken für Charts und Excel-Inhalte -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
  // Globale Variablen für deine Daten
  let jassExcelDaten = null;
  let abendeJsonDaten = null;

  // 1. DATEN BEIM START LADEN
  async function ladeDatenQuellen() {
    try {
      // JSON laden
      const jsonResponse = await fetch('abende.json');
      abendeJsonDaten = await jsonResponse.json();
      
      // Excel laden
      const excelResponse = await fetch('Statistik_Jassen.xlsx');
      const arrayBuffer = await excelResponse.arrayBuffer();
      const data = new Uint8Array(arrayBuffer);
      jassExcelDaten = XLSX.read(data, {type: 'array'});

      // Oberfläche updaten
      verarbeiteUndZeigeDaten();
    } catch (error) {
      console.error("Fehler beim Laden der Dateien:", error);
      document.getElementById('loading').innerText = "Fehler: Statistik_Jassen.xlsx oder abende.json nicht gefunden!";
    }
  }

  // 2. DATEN VERARBEITEN UND ANZEIGEN
  function verarbeiteUndZeigeDaten() {
    // Meta-Daten aus JSON setzen
    if(abendeJsonDaten) {
      document.getElementById('meta-datum').innerText = abendeJsonDaten.stand || 'Unbekannt';
      document.getElementById('meta-abende').innerText = abendeJsonDaten.anzahlAbende || '0';
      
      // Buttons für Einzelabende bauen
      const btnContainer = document.getElementById('einzelabend-buttons');
      btnContainer.innerHTML = '';
      if(abendeJsonDaten.liste) {
        abendeJsonDaten.liste.forEach(abend => {
          btnContainer.innerHTML += `<button class="sub-btn" onclick="zeigeAbendDetails('${abend.id}')">${abend.name}</button>`;
        });
      }
    }

    // Excel-Tabellen auslesen (Beispielhaft das erste Sheet)
    if(jassExcelDaten) {
      const firstSheetName = jassExcelDaten.SheetNames[0];
      const worksheet = jassExcelDaten.Sheets[firstSheetName];
      const jsonSheet = XLSX.utils.sheet_to_json(worksheet);
      
      // Hier bauen wir die Rangliste basierend auf deiner Excel
      baueRangliste(jsonSheet);
    }

    // Lade-Anzeige ausblenden, App einblenden
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    
    // Test-Chart generieren
    generiereChart();
  }

  function baueRangliste(daten) {
    const tabellenMitte = document.getElementById('daten-tabellen');
    const podiumContainer = document.getElementById('podium-container');
    
    // Falls deine Excel Spalten wie "Name" und "Pokale" hat, füttert das die Ansicht:
    if(daten.length > 0) {
      tabellenMitte.innerHTML = `
        <div class="stat-card">
          <div class="stat-card-title">Aktuelle Rangliste (Aus Excel gelesen)</div>
          <table>
            <thead><tr><th>Rang</th><th>Name</th><th class="val-cell">Wert</th></tr></thead>
            <tbody>
              ${daten.map((row, i) => `<tr><td>${i+1}</td><td>${row.Name || 'Spieler'}</td><td class="val-cell">${row.Punkte || row.Pokale || 0}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>`;

      // Podium dynamisch mit den ersten 3 Plätzen füllen
      podiumContainer.innerHTML = `
        <div class="podium-place place-2"><div class="podium-name">${daten[1]?.Name || 'Zweiter'}</div><div class="podium-bar">2</div></div>
        <div class="podium-place place-1"><div class="podium-name">${daten[0]?.Name || 'Erster'}</div><div class="podium-bar">1</div></div>
        <div class="podium-place place-3"><div class="podium-name">${daten[2]?.Name || 'Dritter'}</div><div class="podium-bar">3</div></div>
      `;
    }
  }

  function zeigeAbendDetails(abendId) {
    const content = document.getElementById('einzelabend-content');
    content.innerHTML = `<h2>Details für Abend-ID: ${abendId}</h2><p style="color:var(--gold); margin-top:1rem;">Hier können gezielt Zeilen aus der Excel gefiltert werden.</p>`;
  }

  // Navigation Tabs steuern
  function switchMain(panelId) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.sub-nav').forEach(n => n.classList.remove('open'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    if(panelId === '2627') {
      document.getElementById('tab-2627').classList.add('active');
      document.getElementById('main-btn-2627').classList.add('active');
    } else if (panelId === 'einzelabend') {
      document.getElementById('tab-einzelabend').classList.add('active');
      document.getElementById('sub-einzelabend').classList.add('open');
      document.getElementById('main-btn-einzelabend').classList.add('active');
    }
  }

  function generiereChart() {
    const ctx = document.getElementById('pokalChart');
    if(!ctx) return;
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Abend 1', 'Abend 2', 'Abend 3'],
        datasets: [{ label: 'Punkte-Trend', data: [10, 25, 45], borderColor: '#c9a84c', tension: 0.2 }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  // Starte den Ladevorgang, sobald die Seite geladen ist
  window.onload = ladeDatenQuellen;
</script>
</body>
</html>
