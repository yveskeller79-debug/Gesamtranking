<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jassstatistik Wädi 2026/2027</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;1,300&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --green-dark: #000000;
    --green-mid: #2d6147;
    --green-felt: #3a7d5a;
    --gold: #c9a84c;
    --cream: #f7f2e8;
    --red-card: #c0392b;
    --text: #1a1a1a;
    --muted: #6b6b5a;
    --border: #d4c9a8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--green-dark);
    color: var(--cream);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: linear-gradient(160deg, var(--green-mid) 0%, var(--green-dark) 100%);
    border-bottom: 3px solid var(--gold);
    padding: 2.5rem 2rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '♠ ♥ ♦ ♣';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 12rem;
    opacity: 0.03;
    letter-spacing: 3rem;
    pointer-events: none;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(2rem, 5vw, 3.5rem);
    color: var(--gold);
    letter-spacing: 0.02em;
    line-height: 1.1;
  }
  header p {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: rgba(247,242,232,0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* PODIUM */
  .podium-section {
    max-width: 700px;
    margin: 3rem auto 0;
    padding: 0 1.5rem;
    text-align: center;
  }
  .section-label {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1.5rem;
  }
  .podium {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
  }
  .podium-place {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .podium-name {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    margin-bottom: 0.4rem;
  }
  .podium-pokale {
    font-size: 0.7rem;
    color: rgba(247,242,232,0.6);
    margin-bottom: 0.4rem;
  }
  .podium-bar {
    width: 90px;
    border-radius: 4px 4px 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 1.5rem;
  }
  .place-1 .podium-bar { height: 120px; background: var(--gold); color: var(--green-dark); }
  .place-2 .podium-bar { height: 85px; background: #a0a0a0; color: var(--green-dark); }
  .place-3 .podium-bar { height: 60px; background: #8b6341; color: var(--cream); }
  .place-4 .podium-bar { height: 40px; background: var(--green-felt); color: var(--cream); font-size: 1.1rem; }
  .place-1 .podium-name { font-size: 1.3rem; color: var(--gold); }
  .place-2 .podium-name { font-size: 1.1rem; color: #c8c8c8; }
  .place-3 .podium-name { font-size: 1rem; color: #c8945a; }
  .place-4 .podium-name { font-size: 0.9rem; color: rgba(247,242,232,0.6); }
  .podium-base {
    height: 4px;
    background: var(--gold);
    opacity: 0.3;
    margin-top: 0;
    border-radius: 0 0 2px 2px;
    width: 100%;
  }

  /* MAIN */
  main {
    max-width: 1000px;
    margin: 3rem auto;
    padding: 0 1.5rem 4rem;
  }

  /* CATEGORY SECTIONS */
  .cat-section {
    margin-bottom: 3rem;
  }
  .cat-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.4rem;
    padding-bottom: 0.5rem;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    border-bottom-width: 1px;
    border-bottom-style: solid;
  }
  .cat-title span { opacity: 0.5; font-size: 1rem; }
  .jass-icon { height: 3rem; width: auto; vertical-align: middle; background: #000; border-radius: 6px; padding: 4px; opacity: 1; }
  .jass-icon-sm { height: 2rem; margin-right: 0.2rem; }

  /* Per-category colours */
  /* Strich — spade blue */
  .cat-strich .cat-title   { color: #7eb8e8; border-bottom-color: rgba(126,184,232,0.3); }
  .cat-strich .stat-card   { border-color: rgba(126,184,232,0.25); }
  .cat-strich .stat-card-title { border-bottom-color: rgba(126,184,232,0.2); background: rgba(126,184,232,0.07); color: rgba(126,184,232,0.75); }
  .cat-strich tr.rank-1 td { background: rgba(126,184,232,0.08); }
  .cat-strich tr.rank-1 .name-cell { color: #7eb8e8; }

  /* Pünkt — heart red */
  .cat-puenkt .cat-title   { color: #e87e7e; border-bottom-color: rgba(232,126,126,0.3); }
  .cat-puenkt .stat-card   { border-color: rgba(232,126,126,0.25); }
  .cat-puenkt .stat-card-title { border-bottom-color: rgba(232,126,126,0.2); background: rgba(232,126,126,0.07); color: rgba(232,126,126,0.75); }
  .cat-puenkt tr.rank-1 td { background: rgba(232,126,126,0.08); }
  .cat-puenkt tr.rank-1 .name-cell { color: #e87e7e; }

  /* Mätsch — diamond amber */
  .cat-maetsch .cat-title   { color: #e8b87e; border-bottom-color: rgba(232,184,126,0.3); }
  .cat-maetsch .stat-card   { border-color: rgba(232,184,126,0.25); }
  .cat-maetsch .stat-card-title { border-bottom-color: rgba(232,184,126,0.2); background: rgba(232,184,126,0.07); color: rgba(232,184,126,0.75); }
  .cat-maetsch tr.rank-1 td { background: rgba(232,184,126,0.08); }
  .cat-maetsch tr.rank-1 .name-cell { color: #e8b87e; }

  /* Wiise — club green */
  .cat-wiise .cat-title   { color: #7ee8a8; border-bottom-color: rgba(126,232,168,0.3); }
  .cat-wiise .stat-card   { border-color: rgba(126,232,168,0.25); }
  .cat-wiise .stat-card-title { border-bottom-color: rgba(126,232,168,0.2); background: rgba(126,232,168,0.07); color: rgba(126,232,168,0.75); }
  .cat-wiise tr.rank-1 td { background: rgba(126,232,168,0.08); }
  .cat-wiise tr.rank-1 .name-cell { color: #7ee8a8; }

  /* Übriges — gold (original) */
  .cat-uebrig .cat-title   { color: var(--gold); border-bottom-color: rgba(201,168,76,0.3); }
  .cat-uebrig .stat-card   { border-color: rgba(201,168,76,0.2); }
  .cat-uebrig .stat-card-title { border-bottom-color: rgba(201,168,76,0.15); background: rgba(201,168,76,0.07); color: rgba(201,168,76,0.75); }
  .cat-uebrig tr.rank-1 td { background: rgba(201,168,76,0.08); }
  .cat-uebrig tr.rank-1 .name-cell { color: var(--gold); }

  /* TABLE GRID */
  .table-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
  }

  .stat-card {
    background: rgba(255,255,255,0.04);
    border-radius: 6px;
    overflow: hidden;
  }
  .stat-card-title {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.6rem 0.9rem;
    border-bottom-width: 1px;
    border-bottom-style: solid;
    background: rgba(0,0,0,0.15);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }
  th {
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(247,242,232,0.35);
    padding: 0.45rem 0.9rem;
    text-align: left;
    border-bottom: 1px solid rgba(201,168,76,0.1);
  }
  td {
    padding: 0.5rem 0.9rem;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  tr:last-child td { border-bottom: none; }
  .rank-cell { color: rgba(247,242,232,0.4); width: 24px; }
  .name-cell { font-family: 'Fraunces', serif; font-weight: 700; font-size: 0.9rem; }
  .val-cell { text-align: right; color: var(--cream); }
  .trophy-cell { text-align: center; font-size: 0.9rem; width: 30px; }

  /* Row highlighting handled per-category above */

  /* CHART SECTION */
  .chart-section {
    margin-bottom: 3rem;
  }
  .chart-wrap {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 6px;
    padding: 1.5rem;
  }
  .chart-title {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(247,242,232,0.5);
    margin-bottom: 1.2rem;
  }
  .chart-canvas-wrap { position: relative; height: 220px; }

  /* LEGEND */
  .legend {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    margin-top: 1rem;
    font-size: 0.7rem;
    color: rgba(247,242,232,0.6);
  }
  .legend-item { display: flex; align-items: center; gap: 0.4rem; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 0.65rem;
    color: rgba(247,242,232,0.2);
    letter-spacing: 0.1em;
    border-top: 1px solid rgba(201,168,76,0.1);
  }

  .tagessiege-grid {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  @media (max-width: 600px) {
    .table-grid { grid-template-columns: 1fr; }
    .podium-bar { width: 70px; }
  }
</style>
</head>

const EXCEL_FILE = 'Statistik_Jassen.xlsx';
const PLAYERS = ['Küng', 'Chäli', 'Goonse', 'Fuchs'];
const PLAYER_COLORS = { 'Küng':'#c9a84c', 'Chäli':'#7ec8a4', 'Goonse':'#e07070', 'Fuchs':'#8ab4d4' };

async function loadExcel() {
  try {
    const resp = await fetch(EXCEL_FILE);
    if (resp.ok) {
      const buf = await resp.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const ws = wb.Sheets['Gesamtranking Print'];
      return XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    }
  } catch(e) {}
  const binary = atob(EXCEL_B64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const wb = XLSX.read(bytes, { type: 'array' });
  const ws = wb.Sheets['Gesamtranking Print'];
  return XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
}

function fmt(v) {
  if (v === null || v === '' || v === undefined) return '—';
  if (typeof v === 'number') {
    if (Number.isInteger(v)) return v.toLocaleString('de-CH');
    return v.toLocaleString('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  return String(v);
}

function findCol(row, keyword) {
  return row.findIndex(c => String(c).trim() === String(keyword).trim());
}

function readBlock(rows, keyword) {
  // Layout: each header row has 3 blocks: cols 0-3, 5-8, 10-13
  // keyword is in col 2, 7, or 12; rank in col-2, name in col-1, value in col, trophy in col+1
  const kwCols = [2, 7, 12];
  for (let ri = 0; ri < rows.length; ri++) {
    for (const kc of kwCols) {
      const cell = rows[ri][kc];
      if (cell === undefined || cell === null) continue;
      if (String(cell).trim() === String(keyword).trim()) {
        const rankCol = kc - 2;
        const result = [];
        for (let i = ri + 1; i < ri + 5 && i < rows.length; i++) {
          const r = rows[i];
          const name = r[rankCol + 1];
          if (name === '' || name === undefined || name === null) continue;
          result.push({
            rank:   r[rankCol],
            name:   String(name),
            value:  r[rankCol + 2],
            trophy: r[rankCol + 3] === 1
          });
        }
        if (result.length) return result;
      }
    }
  }
  return [];
}

function buildCard(title, data) {
  if (!data.length) return '';
  const topVal = data[0].value;
  const tbody = data.map(r => {
    const isTop = topVal !== '' && topVal !== 0 && topVal !== null && r.value === topVal;
    return `<tr class="${isTop ? 'rank-1' : ''}">
      <td class="rank-cell">${r.rank ?? '—'}</td>
      <td class="name-cell">${r.name}</td>
      <td class="val-cell">${fmt(r.value)}</td>
      <td class="trophy-cell">${r.trophy ? '🏆' : ''}</td>
    </tr>`;
  }).join('');
  return `<div class="stat-card">
    <div class="stat-card-title">${title}</div>
    <table><thead><tr><th>#</th><th>Spieler</th><th class="val-cell">Wert</th><th class="trophy-cell">🏆</th></tr></thead>
    <tbody>${tbody}</tbody></table>
  </div>`;
}

function buildSection(cls, icon, title, cards) {
  return `<div class="cat-section ${cls}">
    <div class="cat-title"><img src="${icon}" class="jass-icon"> ${title}</div>
    <div class="table-grid">${cards}</div>
  </div>`;
}

function buildTsChart(playerName, labels, data) {
  const id = 'ts_' + playerName.replace(/[^a-z]/gi,'').toLowerCase();
  const color = PLAYER_COLORS[playerName];
  const wrap = document.createElement('div');
  wrap.className = 'chart-wrap';
  wrap.innerHTML = `<div class="chart-title" style="color:${color};">${playerName}</div>
    <div class="chart-canvas-wrap" style="height:160px;"><canvas id="${id}"></canvas></div>`;
  document.getElementById('tagessiegeGrid').appendChild(wrap);
  const pointColors = data.map(v => v === 1 ? '#4caf7d' : v === 0 ? '#c9a84c' : '#e07070');
  new Chart(document.getElementById(id).getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [{ data, borderColor: '#a0a0c0', backgroundColor: 'transparent',
      tension: 0, pointRadius: 7, pointHoverRadius: 9, pointBackgroundColor: pointColors,
      pointBorderColor: pointColors, borderWidth: 2 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: {
        label: c => c.parsed.y===1 ? '✓ Sieg' : c.parsed.y===0 ? '– Unentschieden' : '✗ Niederlage'
      }} },
      scales: {
        x: { ticks: { color:'rgba(247,242,232,0.4)', font:{family:'DM Mono',size:10} }, grid:{color:'rgba(255,255,255,0.05)'} },
        y: { min:-1.5, max:1.5,
          ticks: { color:'rgba(247,242,232,0.45)', font:{family:'DM Mono',size:10}, stepSize:1,
            callback: v => v===1?'Sieg':v===0?'Unentsch.':v===-1?'Niederlage':'' },
          grid: { color: c => c.tick.value===0?'rgba(247,242,232,0.15)':'rgba(255,255,255,0.05)' }
        }
      }
    }
  });
}

async function main() {
  const rows = await loadExcel();

  const gIdx = rows.findIndex(r => String(r[5]).trim()==='Ranking' && String(r[6]).trim()==='Spieler' && String(r[7]).trim()==='Anzahl Pokale');
  const gesamtData = [];
  for (let i = gIdx+1; i < gIdx+5 && i < rows.length; i++) {
    const r = rows[i];
    if (r[6]) gesamtData.push({ rank: Number(r[5]), name: String(r[6]), value: r[7] });
  }
  const sorted = [...gesamtData].sort((a,b) => a.rank - b.rank);
  const podiumOrder = [sorted[1], sorted[0], sorted[2], sorted[3]];
  const podiumClasses = ['place-2','place-1','place-3','place-4'];
  document.getElementById('podium').innerHTML = podiumOrder.map((p,i) => `
    <div class="podium-place ${podiumClasses[i]}">
      <div class="podium-name">${p.name}</div>
      <div class="podium-pokale">${p.value} Pokale</div>
      <div class="podium-bar">${p.rank}.</div>
      <div class="podium-base"></div>
    </div>`).join('');

  const verlaufIdx = rows.findIndex(r => String(r[0]).trim()==='Verlauf Anz. Pokale:');
  // dates are 2 rows below header, player data starts 3 rows below
  const dateRow = rows[verlaufIdx + 2];
  const dateLabels = dateRow.slice(1).filter(c => c !== '' && c !== null && c !== undefined);
  document.getElementById('pokalLegend').innerHTML = PLAYERS.map(p =>
    `<div class="legend-item"><div class="legend-dot" style="background:${PLAYER_COLORS[p]}"></div>${p}</div>`
  ).join('');
  new Chart(document.getElementById('pokalChart').getContext('2d'), {
    type: 'line',
    data: {
      labels: dateLabels,
      datasets: PLAYERS.map((p, pi) => {
        const rowData = rows[verlaufIdx + 3 + pi];
        const vals = dateLabels.map((_,di) => rowData?.[di+1] ?? null).filter(v => v !== null && v !== '');
        return { label: p, data: vals, borderColor: PLAYER_COLORS[p],
          backgroundColor: PLAYER_COLORS[p] + '15', tension: 0.3, pointRadius: 4, borderWidth: 2 };
      })
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks:{color:'rgba(247,242,232,0.4)',font:{family:'DM Mono',size:11}}, grid:{color:'rgba(255,255,255,0.05)'} },
        y: { ticks:{color:'rgba(247,242,232,0.4)',font:{family:'DM Mono',size:11}}, grid:{color:'rgba(255,255,255,0.05)'} }
      }
    }
  });

  const c = (title, kw) => buildCard(title, readBlock(rows, kw));
  document.getElementById('rankings').innerHTML =
    buildSection('cat-strich',  'Eichel.svg',  'Strich',
      c('Total Striche',       'Total\nStriche') +
      c('Total Berg',          'Total Berg') +
      c('ø Striche / Abend',   'ø Anzahl Striche/Abend') +
      c('ø Striche / Spiel',   'ø Anzahl Striche/Spiel') +
      c('Total Schneider',     'Total Schneider') +
      c('Total Kontermatch',   'Total Kontermatch')) +
    buildSection('cat-puenkt', 'Schelle.svg', 'Pünkt',
      c('Total Punkte',        'Total Punkte') +
      c('ø Punkte / Abend',    'ø Anzahl Punkte/Abend') +
      c('ø Punkte / Spiel',    'ø Anzahl Punkte/Spiel')) +
    buildSection('cat-maetsch','Schilte.svg', 'Mätsch',
      c('Total Anzahl Match',  'Total Anzahl Match') +
      c('Total Punkte Match*', 'Total Punkte Match*') +
      c('Match 1-fach',        'Anzahl Match 1fach') +
      c('Match 2-fach',        'Anzahl Match 2fach') +
      c('Match 3-fach',        'Anzahl Match 3fach') +
      c('Match 4-fach',        'Anzahl Match 4fach')) +
    buildSection('cat-wiise',  'Rose.svg',    'Wiise',
      c('Total Punkte Weisen*','Total Punkte Weisen*') +
      c('Anzahl Weisen 20er',  'Anzahl Weisen 20er') +
      c('Punkte Weisen 20er*', 'Punkte Weisen 20er*') +
      c('Anzahl Weisen 50er',  'Anzahl Weisen 50er') +
      c('Punkte Weisen 50er*', 'Punkte Weisen 50er*') +
      c('Anzahl Weisen 100er', 'Anz. Weisen 100er') +
      c('Punkte Weisen 100er*','Punkte Weisen 100er*') +
      c('Anzahl Weisen 150er', 'Anz. Weisen 150er') +
      c('Punkte Weisen 150er*','Punkte Weisen 150er*') +
      c('Anzahl Weisen 200er', 'Anz. Weisen 200er') +
      c('Punkte Weisen 200er*','Punkte Weisen 200er*')) +
    buildSection('cat-uebrig', 'Eichel.svg',  'Übriges',
      c('Anzahl Tagessiege',   'Anz. Tagessiege') +
      c('Anzahl Rundensiege',  'Anz. Rundensiege') +
      c('Anzahl Teilnahmen',   'Anz. Teilnahmen') +
      c('Total Spenden',       'Total Spenden') +
      c('ø Spende / Abend',    'ø Spende/Abend') +
      c('JFK',                 'JFK'));

  const tsIdx = rows.findIndex(r => String(r[0]).trim()==='Verlauf Tagessiege');
  // header row at tsIdx+1 has col numbers, player data starts at tsIdx+2
  // use same dateLabels from Verlauf Pokale
  PLAYERS.forEach(p => {
    const pRow = rows.slice(tsIdx+1, tsIdx+10).find(r => String(r[0]).trim()===p);
    if (!pRow) return;
    const vals = dateLabels.map((_,i) => {
      const v = pRow[i+1];
      return (v !== '' && v !== undefined && v !== null) ? Number(v) : null;
    }).filter(v => v !== null);
    if (vals.length) buildTsChart(p, dateLabels.slice(0, vals.length), vals);
  });

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

main().catch(err => {
  document.getElementById('loading').innerHTML = 'Fehler beim Laden: ' + err.message;
});
</script>
</body>
</html>
