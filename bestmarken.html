<!DOCTYPE html><!-- v1.1 -->
<html lang="de">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,700;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestmarken – Jassstatistik Wädi</title>
<style>

  :root {
    --green-dark: #000000;
    --green-mid: #2d6147;
    --green-felt: #3a7d5a;
    --gold: #c9a84c;
    --cream: #f7f2e8;
    --red-card: #c0392b;
    --text: #1a1a1a;
    --muted: #6b6b5a;
    --border: #d4c9a8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--green-dark);
    color: var(--cream);
    min-height: 100vh;
  }

  header {
    background: linear-gradient(160deg, var(--green-mid) 0%, var(--green-dark) 100%);
    border-bottom: 3px solid var(--gold);
    padding: 2.5rem 2rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '♠ ♥ ♦ ♣';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 12rem;
    opacity: 0.03;
    letter-spacing: 3rem;
    pointer-events: none;
  }
  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(2rem, 5vw, 3.5rem);
    color: var(--gold);
    letter-spacing: 0.02em;
    line-height: 1.1;
  }
  header p {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: rgba(247,242,232,0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .back-nav {
    max-width: 1000px;
    margin: 1.5rem auto 0;
    padding: 0 1.5rem;
  }
  .back-link {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(247,242,232,0.4);
    text-decoration: none;
    border: 1px solid rgba(201,168,76,0.2);
    padding: 0.4rem 1rem;
    border-radius: 4px;
    display: inline-block;
    transition: all 0.2s;
  }
  .back-link:hover { color: var(--gold); border-color: var(--gold); }

  main {
    max-width: 1000px;
    margin: 2rem auto;
    padding: 0 1.5rem 4rem;
  }

  #loading {
    text-align: center;
    padding: 4rem;
    color: rgba(247,242,232,0.4);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
  }

  /* CATEGORY SECTIONS */
  .cat-section { margin-bottom: 3rem; }
  .cat-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.4rem;
    padding-bottom: 0.5rem;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    border-bottom-width: 1px;
    border-bottom-style: solid;
  }
  .jass-icon     { height: 3rem; width: auto; vertical-align: middle; background: #000; border-radius: 6px; padding: 4px; }
  .jass-icon-sm  { height: 2rem; margin-right: 0.2rem; }

  /* Per-category colours */
  .cat-strich  .cat-title    { color: #7eb8e8; border-bottom-color: rgba(126,184,232,0.3); }
  .cat-strich  .bm-col-label { color: #7eb8e8; border-bottom-color: rgba(126,184,232,0.3); }
  .cat-strich  .bm-record    { border-color: rgba(126,184,232,0.25); }
  .cat-strich  .bm-record-title { border-bottom-color: rgba(126,184,232,0.2); background: rgba(126,184,232,0.07); color: rgba(126,184,232,0.75); }

  .cat-puenkt  .cat-title    { color: #e87e7e; border-bottom-color: rgba(232,126,126,0.3); }
  .cat-puenkt  .bm-col-label { color: #e87e7e; border-bottom-color: rgba(232,126,126,0.3); }
  .cat-puenkt  .bm-record    { border-color: rgba(232,126,126,0.25); }
  .cat-puenkt  .bm-record-title { border-bottom-color: rgba(232,126,126,0.2); background: rgba(232,126,126,0.07); color: rgba(232,126,126,0.75); }

  .cat-maetsch .cat-title    { color: #e8b87e; border-bottom-color: rgba(232,184,126,0.3); }
  .cat-maetsch .bm-col-label { color: #e8b87e; border-bottom-color: rgba(232,184,126,0.3); }
  .cat-maetsch .bm-record    { border-color: rgba(232,184,126,0.25); }
  .cat-maetsch .bm-record-title { border-bottom-color: rgba(232,184,126,0.2); background: rgba(232,184,126,0.07); color: rgba(232,184,126,0.75); }

  .cat-wiise   .cat-title    { color: #7ee8a8; border-bottom-color: rgba(126,232,168,0.3); }
  .cat-wiise   .bm-col-label { color: #7ee8a8; border-bottom-color: rgba(126,232,168,0.3); }
  .cat-wiise   .bm-record    { border-color: rgba(126,232,168,0.25); }
  .cat-wiise   .bm-record-title { border-bottom-color: rgba(126,232,168,0.2); background: rgba(126,232,168,0.07); color: rgba(126,232,168,0.75); }

  .cat-uebrig  .cat-title    { color: var(--gold); border-bottom-color: rgba(201,168,76,0.3); }
  .cat-uebrig  .bm-col-label { color: var(--gold); border-bottom-color: rgba(201,168,76,0.3); }
  .cat-uebrig  .bm-record    { border-color: rgba(201,168,76,0.2); }
  .cat-uebrig  .bm-record-title { border-bottom-color: rgba(201,168,76,0.15); background: rgba(201,168,76,0.07); color: rgba(201,168,76,0.75); }

  /* TWO-COLUMN LAYOUT */
  .bm-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }
  @media (max-width: 640px) { .bm-grid { grid-template-columns: 1fr; } }

  .bm-col-label {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.4rem;
    padding-bottom: 0.5rem;
    margin-bottom: 1.25rem;
    border-bottom-width: 1px;
    border-bottom-style: solid;
  }

  /* RECORD CARDS */
  .bm-col > div + div { margin-top: 0.65rem; }

  .bm-record {
    background: rgba(255,255,255,0.04);
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.07);
    overflow: hidden;
  }
  .bm-record-title {
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 500;
    padding: 0.55rem 0.9rem;
    border-bottom-width: 1px;
    border-bottom-style: solid;
    background: rgba(0,0,0,0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .bm-record-body {
    padding: 0.6rem 0.9rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.5rem;
  }
  .bm-record-who {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 0.95rem;
  }
  .bm-record-val {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 1.3rem;
    color: var(--gold);
    white-space: nowrap;
  }
  .bm-record-meta {
    font-size: 0.68rem;
    color: rgba(247,242,232,0.3);
    margin-top: 0.1rem;
  }

  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 0.65rem;
    color: rgba(247,242,232,0.2);
    letter-spacing: 0.1em;
    border-top: 1px solid rgba(201,168,76,0.1);
  }

  #scrollToTopBtn {
    display: none;
    position: fixed;
    bottom: 25px;
    right: 25px;
    z-index: 999;
    border: 1px solid rgba(201,168,76,0.4);
    outline: none;
    background-color: rgba(45,97,71,0.9);
    color: var(--gold);
    cursor: pointer;
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 16px;
    font-weight: bold;
    backdrop-filter: blur(5px);
    transition: all 0.2s ease;
  }
  #scrollToTopBtn:hover { background-color: var(--gold); color: var(--green-dark); border-color: var(--gold); }

</style>
</head>
<body>

<header>
  <h1>Bestmarken</h1>
  <p>Jassstatistik Wädi — All-time &amp; Pro Saison</p>
</header>

<div class="back-nav">
  <a class="back-link" href="index.html">← Zurück zur Übersicht</a>
</div>

<main>
  <div id="loading">Daten werden geladen…</div>
  <div id="app" style="display:none;"></div>
</main>

<footer>Jassstatistik Wädi · Bestmarken · All-time &amp; Pro Saison</footer>
<button id="scrollToTopBtn" title="Zurück nach oben">↑</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const EXCEL_FILE = 'https://raw.githubusercontent.com/yveskeller79-debug/Gesamtranking/main/Bestmarken.xlsx';

// Col indices in the sheet (0-based)
// Pro Abend:  A=0 label, B=1 wert, C=2 sp1, D=3 sp2, E=4 sp3, F=5 sp4, G=6 datum
// Pro Saison: I=8 label, J=9 wert, K=10 sp1, L=11 sp2, M=12 sp3, N=13 sp4, O=14 saison

function fmtDate(v) {
  if (!v) return '';
  if (typeof v === 'string') return v; // 'div.' or season string
  if (v instanceof Date) {
    const d = String(v.getDate()).padStart(2,'0');
    const m = String(v.getMonth()+1).padStart(2,'0');
    return `${d}.${m}.${v.getFullYear()}`;
  }
  // XLSX serial date
  if (typeof v === 'number') {
    const d = XLSX.SSF.parse_date_code(v);
    if (d) return `${String(d.d).padStart(2,'0')}.${String(d.m).padStart(2,'0')}.${d.y}`;
  }
  return String(v);
}

function fmtVal(v) {
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (isNaN(n)) return String(v);
  // percentage: values <= 1 and label contains "anteil"
  if (n > 0 && n <= 1 && String(v).includes('.')) return (n * 100).toFixed(1) + '%';
  if (Number.isInteger(n)) return n.toLocaleString('de-CH');
  return n.toLocaleString('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtValWithLabel(label, v) {
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (isNaN(n)) return String(v);
  const lc = String(label).toLowerCase();
  if (lc.includes('anteil')) return (n * 100).toFixed(1) + '%';
  if (Number.isInteger(n)) return n.toLocaleString('de-CH');
  return n.toLocaleString('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function players(row, sp1col, datecol) {
  const names = [row[sp1col], row[sp1col+1], row[sp1col+2], row[sp1col+3]]
    .map(v => (v && String(v).trim()) || '')
    .filter(Boolean);
  const dateVal = row[datecol];
  const isDivergent = dateVal && String(dateVal).trim().toLowerCase() === 'div.';
  return names.join(isDivergent ? ', ' : ' & ');
}

function card(label, val, who, meta) {
  if (!label) return '';
  return `<div class="bm-record">
    <div class="bm-record-title">${label}</div>
    <div class="bm-record-body">
      <div>
        <div class="bm-record-who">${who || '—'}</div>
        <div class="bm-record-meta">${meta || ''}</div>
      </div>
      <div class="bm-record-val">${val}</div>
    </div>
  </div>`;
}

function buildSection(cls, iconHtml, title, abendRows, saisonRows) {
  const abendCards = abendRows.map(r =>
    card(r[0], fmtValWithLabel(r[0], r[1]), players(r, 2, 6), fmtDate(r[6]))
  ).join('');
  const saisonCards = saisonRows.map(r =>
    card(r[8], fmtValWithLabel(r[8], r[9]), players(r, 10, 14), r[14] ? String(r[14]) : '')
  ).join('');

  return `<div class="cat-section ${cls}">
    <div class="cat-title">${iconHtml} ${title}</div>
    <div class="bm-grid">
      <div class="bm-col">
        <div class="bm-col-label">Pro Abend</div>
        ${abendCards}
      </div>
      <div class="bm-col">
        <div class="bm-col-label">Pro Saison</div>
        ${saisonCards}
      </div>
    </div>
  </div>`;
}

async function loadBestmarken() {
  const resp = await fetch(EXCEL_FILE);
  if (!resp.ok) throw new Error('Datei konnte nicht geladen werden.');
  const buf = await resp.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  const ws = wb.Sheets['Tabelle1'];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

  // Find section header rows by label in col A or col I
  function findSection(label) {
    return rows.findIndex(r =>
      String(r[0]).trim().toLowerCase().startsWith(label.toLowerCase()) ||
      String(r[8]).trim().toLowerCase().startsWith(label.toLowerCase())
    );
  }

  // Extract rows between two section starts (col A non-empty = header row, skip it)
  function sectionRows(startRow, endRow) {
    const result = [];
    for (let i = startRow + 1; i < endRow && i < rows.length; i++) {
      const r = rows[i];
      // skip sub-header rows (contain 'Wert' in col B / J)
      if (String(r[1]).trim() === 'Wert' || String(r[9]).trim() === 'Wert') continue;
      // include if either abend label or saison label is non-empty
      if ((r[0] && String(r[0]).trim()) || (r[8] && String(r[8]).trim())) {
        result.push(r);
      }
    }
    return result;
  }

  const idxStrich  = findSection('Striche');
  const idxPuenkt  = findSection('Pünkt');
  const idxMaetsch = findSection('Mätsch');
  const idxWiise   = findSection('Wiise');
  const idxUebrig  = findSection('Übriges');
  const idxEnd     = rows.length;

  // For Mätsch: abend header is at idxMaetsch, saison header appears 1 row later (row 18)
  // We just read all rows in the block and split by which columns are filled
  function abendOnly(r)  { return r[0] && String(r[0]).trim(); }
  function saisonOnly(r) { return r[8] && String(r[8]).trim(); }

  function splitBlock(startIdx, endIdx) {
    const all = sectionRows(startIdx, endIdx);
    return {
      abend:  all.filter(abendOnly),
      saison: all.filter(saisonOnly)
    };
  }

  const strich  = splitBlock(idxStrich,  idxPuenkt);
  const puenkt  = splitBlock(idxPuenkt,  idxMaetsch);
  const maetsch = splitBlock(idxMaetsch, idxWiise);
  const wiise   = splitBlock(idxWiise,   idxUebrig);
  const uebrig  = splitBlock(idxUebrig,  idxEnd);

  const iconSm = name => `<img src="${name}" class="jass-icon jass-icon-sm">`;

  document.getElementById('app').innerHTML =
    buildSection('cat-strich',  `<img src="Eichel.svg"  class="jass-icon">`, 'Strich',  strich.abend,  strich.saison)  +
    buildSection('cat-puenkt',  `<img src="Schelle.svg" class="jass-icon">`, 'Pünkt',   puenkt.abend,  puenkt.saison)  +
    buildSection('cat-maetsch', `<img src="Schilte.svg" class="jass-icon">`, 'Mätsch',  maetsch.abend, maetsch.saison) +
    buildSection('cat-wiise',   `<img src="Rose.svg"    class="jass-icon">`, 'Wiise',   wiise.abend,   wiise.saison)   +
    buildSection('cat-uebrig',
      iconSm('Eichel.svg') + iconSm('Schelle.svg') + iconSm('Schilte.svg') + iconSm('Rose.svg'),
      'Übriges', uebrig.abend, uebrig.saison);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

loadBestmarken().catch(err => {
  document.getElementById('loading').innerHTML =
    '<span style="color:#e07070;">Fehler beim Laden: ' + err.message + '</span>';
});

const mybutton = document.getElementById("scrollToTopBtn");
window.addEventListener("scroll", () => {
  mybutton.style.display = (document.documentElement.scrollTop > 400) ? "block" : "none";
});
mybutton.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
</script>

</body>
</html>
